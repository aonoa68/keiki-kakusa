site_name: 景気・格差問題と統計情報
site_description: 立教大学「景気・格差問題と統計情報」2025年度 授業資料（過去の担当授業）
site_author: 小野原 彩香
site_url: https://aonoa68.github.io/keiki-kakusa/
repo_url: https://github.com/aonoa68/keiki-kakusa
repo_name: aonoa68/keiki-kakusa

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ja

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - ホーム: index.md
  - 各回の資料:
      - "第1回 ガイダンス": week01.md
      - "第5回 データへのアクセス演習": week05.md
      - "第7回 人口統計演習": week07.md
      - "第9回 労働統計演習": week09.md
      - "第11回 賃金統計演習": week11.md
      - "第13回 消費統計演習": week13.md
      - "第14回 まとめ": week14.md
  - 担当授業の一覧（Teaching）: https://aonoa68.github.io/teaching/

copyright: © 小野原 彩香 — 立教大学「景気・格差問題と統計情報」（2022〜2025年度）
